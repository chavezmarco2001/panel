<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel</title>
<meta name="description" content="Mi día, mi semana, mis tareas y mis fechas, guardados en mi celular.">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">

  <!-- installable app (hacer-instalable) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E6B62">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
<header class="top">
  <div>
    <h1 id="titulo">Hoy</h1>
    <p class="fecha-hoy" id="fecha-hoy"></p>
  </div>
  <button class="icon-btn" type="button" data-action="ajustes" aria-label="Ajustes y respaldo">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.6.1-.9-.1-.9 2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.6-.9L15 3.6h-4l-.4 2.6c-.6.2-1.1.5-1.6.9l-2.4-1-2 3.4 2 1.6-.1.9.1.9-2 1.6 2 3.4 2.4-1c.5.4 1 .7 1.6.9l.4 2.6h4l.4-2.6c.6-.2 1.1-.5 1.6-.9l2.4 1 2-3.4-2-1.6Z"/></svg>
  </button>
</header>

<main id="app" tabindex="-1"></main>

<button class="fab" type="button" data-action="nuevo" aria-label="Anotar algo">
  <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
</button>

<nav class="tabbar" aria-label="Secciones">
  <button type="button" data-action="vista" data-v="hoy">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0-6 1 3h-2l1-3Zm0 22-1-3h2l-1 3ZM1 12l3-1v2l-3-1Zm22 0-3 1v-2l3 1Z"/></svg>
    <span>Hoy</span>
  </button>
  <button type="button" data-action="vista" data-v="semana">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2Zm12 7H5v10h14V9Z"/></svg>
    <span>Semana</span>
  </button>
  <button type="button" data-action="vista" data-v="tareas">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m9 16.2-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg>
    <span>Tareas</span>
  </button>
  <button type="button" data-action="vista" data-v="fechas">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 3h2v18H5V3Zm4 1h10l-2 4 2 4H9V4Z"/></svg>
    <span>Fechas</span>
  </button>
</nav>

<dialog id="sheet" aria-labelledby="sheet-t"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
  <script src="pwa-register.js" defer></script>
</body>
</html>
